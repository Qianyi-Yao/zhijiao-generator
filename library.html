<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>微考据图书馆｜知交圈生成器</title>
  <meta name="description" content="忘川风华录知交圈微考据图文库：考据原图与文字，按人物、日期周、标题筛选浏览。" />
  <link rel="icon" type="image/png" href="ui/zhijiaoquan-icon.png" />
  <style>
    @font-face { font-family: "Jinling"; src: url("fonts/BWKS.woff2") format("woff2"); font-display: swap; }
    @font-face { font-family: "ShengshiKai"; src: url("fonts/FZSHENGSKSJW_CU.woff2") format("woff2"); font-display: swap; }

    :root {
      --paper: #f8f1df;
      --ink: #3f382f;
      --muted: #8a8072;
      --line: #ded7c8;
      --panel: #fffdf8;
      --green: #69816f;
      --green-dark: #485e50;
      --gold: #b88749;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "SimSun", "Songti SC", "Noto Serif SC", serif;
      font-size: 16px;
      line-height: 1.9;
      min-height: 100vh;
    }
    .library-wrap { max-width: 880px; margin: 0 auto; padding: 28px 20px 60px; }

    header.library-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    header.library-head h1 { font-family: "Jinling", serif; font-size: 28px; letter-spacing: 3px; }
    header.library-head .back { font-size: 13px; color: var(--green-dark); text-decoration: none; border-bottom: 1px dashed var(--green-dark); }
    header.library-head .note { font-size: 12px; color: var(--muted); margin-left: auto; }

    .filter-bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
    .filter-bar input, .filter-bar select {
      border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
      padding: 7px 10px; font: 13px/1.4 inherit; color: var(--ink); outline: none;
    }
    .filter-bar input[type="search"] { flex: 1; min-width: 150px; }
    .filter-bar .week-select { flex: none; }
    .filter-label { font-size: 12px; color: var(--muted); }
    .clear-btn {
      border: 1px solid var(--line); background: var(--panel); border-radius: 999px;
      padding: 3px 10px; font-size: 12px; cursor: pointer; color: var(--muted);
    }
    .clear-btn:hover { background: #f0ead9; }
    .hidden { display: none !important; }
    /* 新 UI 控件统一粗金陵体 */
    .filter-bar input, .filter-bar select, .clear-btn, .filter-label,
    .page-btn, .expand-btn {
      font-family: "Jinling", "Noto Serif SC", serif;
      font-weight: bold;
    }

    .article-card {
      background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
      margin-bottom: 14px; overflow: hidden; box-shadow: 0 1px 3px rgba(90, 70, 40, .06);
    }
    .article-head { padding: 13px 16px; cursor: pointer; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
    .article-head:hover { background: #f6f1e4; }
    .article-title { font-size: 18px; letter-spacing: 1px; font-family: "Jinling", serif; }
    .article-meta { font-size: 12px; color: var(--muted); font-family: "ShengshiKai", "Noto Serif SC", serif; }
    .article-tags { display: inline-flex; gap: 6px; flex-wrap: wrap; font-family: "ShengshiKai", "Noto Serif SC", serif; }
    .tag {
      font-size: 11px; color: var(--green-dark); border: 1px solid #b9c9ba; border-radius: 999px;
      padding: 1px 8px; background: #f0f4ee; cursor: pointer;
    }
    .tag:hover { background: #e0e9dd; }
    .article-body { display: none; padding: 6px 18px 18px; border-top: 1px dashed var(--line); }
    .article-card.open .article-body { display: block; }

    .media-row { display: flex; gap: 18px; align-items: flex-start; margin: 12px 0; }
    .media-imgs { flex: 0 0 180px; }
    .media-imgs img {
      width: 100%; height: auto; border-radius: 8px; border: 1px solid var(--line); background: #fff;
      margin-bottom: 8px; display: block;
    }
    .media-text { flex: 1; min-width: 0; }
    .media-text p { margin: 0 0 10px; }
    .img-only img { width: 180px; margin: 12px 0; display: block; border-radius: 8px; border: 1px solid var(--line); background: #fff; }
    .rich-text { white-space: pre-wrap; word-break: break-word; }
    .rich-text strong { font-weight: 700; }
    .rich-text em { font-style: italic; }

    .empty-tip { text-align: center; color: var(--muted); padding: 40px 0; }
    .pager { display: flex; justify-content: center; align-items: center; gap: 6px; flex-wrap: wrap; margin: 18px 0; }
    .page-btn {
      border: 1px solid var(--line); background: var(--panel); border-radius: 6px;
      padding: 4px 11px; font-size: 14px; cursor: pointer; color: var(--ink);
      font-family: inherit;
    }
    .page-btn:hover { background: #f0ead9; }
    .page-num { font-family: "Jinling", serif; font-weight: bold; font-size: 15px; }
    .page-num.active { background: var(--green-dark); color: #fff; border-color: var(--green-dark); }
    .page-ellipsis {
      padding: 4px 2px;
      color: var(--muted);
      font-family: "Jinling", serif;
      font-weight: bold;
    }
    .expand-btn { margin: 6px auto 0; display: block; font-size: 15px; padding: 8px 22px; }

    .foot-note { text-align: center; font-size: 12px; color: #a89a82; margin-top: 30px; }

    @media (max-width: 560px) {
      .library-wrap { padding: 20px 14px 50px; }
      header.library-head h1 { font-size: 24px; }
      header.library-head .note { display: none; }
      .filter-bar input[type="search"] { flex: 1 1 100%; }
      .filter-bar .week-select { flex: 1; }
      .article-title { font-size: 16px; }
      .page-btn { padding: 4px 8px; font-size: 13px; }
      .media-row { flex-direction: column; }
      .media-imgs { flex: none; width: 100%; }
      .img-only img { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="library-wrap">
    <header class="library-head">
      <h1>微考据图书馆</h1>
      <a class="back" href="index.html">← 返回生成器</a>
      <span class="note">忘川风华录知交圈微考据 · 图文整理</span>
    </header>

    <div class="filter-bar">
      <input id="searchInput" type="search" placeholder="搜索标题关键词……" />
      <input id="characterSearch" type="search" placeholder="搜索人物（输入后回车选择）……" />
      <select id="characterSelect" class="hidden" aria-label="人物候选"></select>
      <select id="weekYear" class="week-select" aria-label="年"><option value="">年</option></select>
      <select id="weekMonth" class="week-select" aria-label="月" disabled><option value="">月</option></select>
      <select id="weekDay" class="week-select" aria-label="日" disabled><option value="">日</option></select>
      <span id="weekLabel" class="filter-label"></span>
      <button id="clearFilters" class="clear-btn hidden" type="button">清除筛选</button>
    </div>

    <div id="articleList"></div>
    <p class="foot-note">内容由作者整理发布，素材版权归原权利人所有</p>
  </div>

  <script src="characters.js"></script>
  <script>
    let articles = [];
    let mode = 'preview';      // 'preview' 预览3篇 | 'paged' 分页浏览
    let page = 1;
    let pageCount = 0;
    let selectedChar = '';     // 当前人物筛选
    let selectedYear = '';     // 年
    let selectedMonth = '';    // 月
    let selectedWeek = '';     // 完整周（date_start 的周日）
    const PAGE_SIZE = 10;
    const PREVIEW_COUNT = 3;
    const MAX_PAGE_BUTTONS = 10;
    const list = document.getElementById('articleList');
    const searchInput = document.getElementById('searchInput');
    const characterSearch = document.getElementById('characterSearch');
    const characterSelect = document.getElementById('characterSelect');
    const weekYear = document.getElementById('weekYear');
    const weekMonth = document.getElementById('weekMonth');
    const weekDay = document.getElementById('weekDay');
    const weekLabel = document.getElementById('weekLabel');
    const clearFilters = document.getElementById('clearFilters');

    function esc(text) {
      return String(text ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
    }

    function episodeLabel(a) {
      if (!a.date_start || !a.date_end) {
        throw new Error(
          `文章日期不完整：${a.title || a.id || '未知文章'}`
        );
      }

      return a.date_start.replace(/-/g, '').slice(2) + '期';
    }

    function renderRuns(runs) {
      return (runs || []).map(r => {
        let t = esc(r.text || '');
        if (!t) return '';
        if (r.bold) t = '<strong>' + t + '</strong>';
        if (r.italic) t = '<em>' + t + '</em>';
        if (r.strike) t = '<s>' + t + '</s>';
        const styles = [];
        if (r.color) styles.push('color:' + esc(r.color));
        if (r.font) styles.push('font-family:\'KaiTi\',\'STKaiti\',\'Noto Serif SC\',serif'); // 引用统一楷体
        return styles.length ? '<span style="' + styles.join(';') + '">' + t + '</span>' : t;
      }).join('');
    }

    function renderParagraph(p) {
      const imgs = (p.images || []).map(img =>
        '<img src="library/' + esc(img) + '" alt="考据配图" loading="lazy">');
      const textHtml = '<span class="rich-text">' + renderRuns(p.runs) + '</span>';
      if (imgs.length && (p.runs || []).some(r => (r.text || '').trim())) {
        return '<div class="media-row"><div class="media-imgs">' + imgs.join('') +
               '</div><div class="media-text">' + textHtml + '</div></div>';
      }
      if (imgs.length) return '<div class="img-only">' + imgs.join('') + '</div>';
      return '<p>' + textHtml + '</p>';
    }

    function getFilterState() {
      const titleInput = searchInput.value;

      return {
        titleInput,
        titleQuery: titleInput.trim().toLowerCase(),
        character: selectedChar,
        year: selectedYear,
        month: selectedMonth,
        monthPrefix: selectedYear && selectedMonth
          ? selectedYear + '-' + String(selectedMonth).padStart(2, '0')
          : '',
        week: selectedWeek
      };
    }

    function filtered(filters) {
      return articles.filter(a => {
        if (
          filters.titleQuery &&
          !a.title.toLowerCase().includes(filters.titleQuery)
        ) return false;

        if (
          filters.character &&
          !(a.characters || []).includes(filters.character)
        ) return false;

        if (filters.week) {
          if (a.date_start !== filters.week) return false;
        } else {
          if (
            filters.year &&
            !(a.date_start || '').startsWith(filters.year)
          ) return false;

          if (
            filters.monthPrefix &&
            !(a.date_start || '').startsWith(filters.monthPrefix)
          ) return false;
        }

        return true;
      });
    }

    function renderFromFirstPage() {
      page = 1;
      render();
    }

    // 人物筛选：搜索 → 回车 → 候选列表（全部 161 角色）
    characterSearch.onkeydown = e => {
      if (e.key !== 'Enter') return;
      e.preventDefault();

      const kw = characterSearch.value.trim().toLowerCase();

      if (!kw) {
        characterSelect.classList.add('hidden');
        return;
      }

      const matches = characters.filter(c =>
        [c.name, c.dynasty, c.rarity, c.role, c.id]
          .join(' ')
          .toLowerCase()
          .includes(kw)
      );

      characterSelect.innerHTML =
        '<option value="" selected disabled>请选择人物</option>' +
        matches.map(c =>
          `<option value="${esc(c.name)}">${esc(c.name)} · ${esc(c.dynasty)}</option>`
        ).join('');

      characterSelect.classList.remove('hidden');
      characterSelect.focus();

      if (typeof characterSelect.showPicker === 'function') {
        try {
          characterSelect.showPicker();
        } catch (err) {
          characterSelect.click();
        }
      } else {
        characterSelect.click();
      }
    };
    characterSelect.onchange = () => {
      if (characterSelect.value) {
        selectedChar = characterSelect.value;
        characterSearch.value = selectedChar;
        characterSelect.classList.add('hidden');
        renderFromFirstPage();
      }
    };
    characterSearch.oninput = () => {
      characterSelect.classList.add('hidden');

      if (!characterSearch.value.trim()) {
        selectedChar = '';
        renderFromFirstPage();
      }
    };

    // 周筛选：年/月/日 下拉（中文）→ 选完自动归到该周（周日~周六）
    function fillMonthOptions() {
      weekMonth.innerHTML = '<option value="">月</option>' +
        Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${i + 1}月</option>`).join('');
    }
    function fillDayOptions() {
      const y = +weekYear.value, m = +weekMonth.value;
      if (!y || !m) { weekDay.innerHTML = '<option value="">日</option>'; return; }
      const days = new Date(y, m, 0).getDate();
      weekDay.innerHTML = '<option value="">日</option>' +
        Array.from({ length: days }, (_, i) => `<option value="${i + 1}">${i + 1}日</option>`).join('');
    }
    function updateDateControls() {
      weekMonth.disabled = !weekYear.value;
      weekDay.disabled = !weekYear.value || !weekMonth.value;
    }
    function onWeekChange() {
      const y = weekYear.value, m = weekMonth.value, d = weekDay.value;
      selectedYear = y || '';
      selectedMonth = m || '';
      if (y && m && d) {
        const date = new Date(+y, +m - 1, +d);
        const sun = new Date(date);
        sun.setDate(date.getDate() - date.getDay());
        const pad = n => String(n).padStart(2, '0');
        selectedWeek = sun.getFullYear() + '-' + pad(sun.getMonth() + 1) + '-' + pad(sun.getDate());
        const end = new Date(sun);
        end.setDate(sun.getDate() + 6);
        weekLabel.textContent = selectedWeek + ' ~ ' + end.getFullYear() + '-' + pad(end.getMonth() + 1) + '-' + pad(end.getDate());
      } else {
        selectedWeek = '';
        weekLabel.textContent = (y ? y + '年' : '') + (m ? ' ' + m + '月' : '');
      }
      renderFromFirstPage();
    }
    weekYear.onchange = () => {
      if (!weekYear.value) {
        weekMonth.value = '';
      }

      fillDayOptions();
      updateDateControls();
      onWeekChange();
    };
    weekMonth.onchange = () => {
      fillDayOptions();
      updateDateControls();
      onWeekChange();
    };
    weekDay.onchange = onWeekChange;
    fillMonthOptions();
    fillDayOptions();
    updateDateControls();

    clearFilters.onclick = () => {
      searchInput.value = '';
      characterSearch.value = '';
      selectedChar = '';
      weekYear.value = '';
      weekMonth.value = '';
      weekDay.innerHTML = '<option value="">日</option>';
      selectedYear = '';
      selectedMonth = '';
      selectedWeek = '';
      weekLabel.textContent = '';
      updateDateControls();
      renderFromFirstPage();
    };

    function updateFilterBar(filters) {
      const active =
        filters.titleInput ||
        filters.character ||
        filters.year ||
        filters.month ||
        filters.week;

      clearFilters.classList.toggle('hidden', !active);
    }

    function visiblePageNumbers(totalPages) {
      if (totalPages <= MAX_PAGE_BUTTONS) {
        return Array.from({ length: totalPages }, (_, index) => index + 1);
      }

      const currentPageNeedsOwnButton =
        page > MAX_PAGE_BUTTONS - 1 &&
        page < totalPages;

      const leadingPageCount = currentPageNeedsOwnButton
        ? MAX_PAGE_BUTTONS - 2
        : MAX_PAGE_BUTTONS - 1;

      const pages = Array.from(
        { length: leadingPageCount },
        (_, index) => index + 1
      );

      if (currentPageNeedsOwnButton) {
        pages.push(page);
      }

      pages.push(totalPages);
      return pages;
    }

    function buildPager(totalPages) {
      const pageNumbers = visiblePageNumbers(totalPages);
      let html = '<button class="page-btn" data-page="prev" aria-label="上一页">‹</button>';
      let previousPage = 0;

      pageNumbers.forEach(pageNumber => {
        if (previousPage && pageNumber - previousPage > 1) {
          html += '<span class="page-ellipsis" aria-hidden="true">…</span>';
        }

        html += `
          <button
            class="page-btn page-num ${pageNumber === page ? 'active' : ''}"
            data-page="${pageNumber}"
          >${pageNumber}</button>`;

        previousPage = pageNumber;
      });

      html += '<button class="page-btn" data-page="next" aria-label="下一页">›</button>';
      return '<div class="pager">' + html + '</div>';
    }

    function getPageView(items) {
      if (mode === 'preview') {
        return {
          shown: items.slice(0, PREVIEW_COUNT),
          pager: items.length > PREVIEW_COUNT
            ? `<div class="pager"><button class="page-btn expand-btn" id="expandAll">展开全部（共${items.length}篇）</button></div>`
            : '',
          totalPages: 0
        };
      }

      const totalPages = Math.max(1, Math.ceil(items.length / PAGE_SIZE));
      if (page > totalPages) page = totalPages;

      const start = (page - 1) * PAGE_SIZE;

      return {
        shown: items.slice(start, start + PAGE_SIZE),
        pager: buildPager(totalPages),
        totalPages
      };
    }

    function render() {
      const filters = getFilterState();
      const items = filtered(filters);
      updateFilterBar(filters);

      if (!items.length) {
        pageCount = 0;
        list.innerHTML = '<div class="empty-tip">没有符合条件的考据。</div>';
        return;
      }

      const pageView = getPageView(items);
      pageCount = pageView.totalPages;

      list.innerHTML = pageView.shown.map(a => {
        const tags = (a.characters || []).map(c =>
          `<span class="tag" data-tag="${esc(c)}">${esc(c)}</span>`).join('');
        const meta = `${a.date_start} ~${a.date_end} · ${episodeLabel(a)}`;
        const body = a.paragraphs.map(renderParagraph).join('');
        return `<article class="article-card">
          <div class="article-head">
            <span class="article-title">${esc(a.title)}</span>
            <span class="article-meta">${esc(meta)}</span>
            <span class="article-tags">${tags}</span>
          </div>
          <div class="article-body">${body}</div>
        </article>`;
      }).join('') + pageView.pager;
    }

    list.onclick = event => {
      if (!(event.target instanceof Element)) return;

      const tag = event.target.closest('[data-tag]');
      if (tag) {
        event.stopPropagation();
        selectedChar = tag.dataset.tag;
        characterSearch.value = selectedChar;
        renderFromFirstPage();
        return;
      }

      const expandBtn = event.target.closest('#expandAll');
      if (expandBtn) {
        mode = 'paged';
        page = 1;
        render();
        return;
      }

      const pageBtn = event.target.closest('[data-page]');
      if (pageBtn) {
        const value = pageBtn.dataset.page;

        if (value === 'prev') {
          page = Math.max(1, page - 1);
        } else if (value === 'next') {
          page = Math.min(pageCount, page + 1);
        } else {
          page = +value;
        }

        render();
        return;
      }

      const articleHead = event.target.closest('.article-head');
      if (articleHead) {
        articleHead.parentElement.classList.toggle('open');
      }
    };

    searchInput.oninput = renderFromFirstPage;

    fetch('library/data/library.json')
      .then(r => r.json())
      .then(data => {
        articles = (data.articles || []).sort((a, b) =>
          (a.date_start || '').localeCompare(b.date_start || ''));
        const years = [...new Set(articles.map(a => (a.date_start || '').slice(0, 4)))]
          .filter(Boolean).sort();
        weekYear.innerHTML = '<option value="">年</option>' +
          years.map(y => `<option value="${y}">${y}年</option>`).join('');
        render();
      })
      .catch(() => { list.innerHTML = '<div class="empty-tip">数据加载失败，请用 Live Server 打开。</div>'; });
  </script>
</body>
</html>
